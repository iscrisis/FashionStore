# Orquesta el stack completo (backend + PostgreSQL + frontend web) para desarrollo local.
#
# Nota sobre variables de entorno: Docker Compose sustituye los ${VAR} de este archivo
# usando un ".env" ubicado en esta misma carpeta (la raíz del repo). Los contenedores en sí
# reciben su configuración real desde backend/.env (ver "env_file" de cada servicio). Si
# cambias POSTGRES_USER/POSTGRES_PASSWORD en backend/.env, actualiza también el .env de la
# raíz para que ambos coincidan (ver .env.example en la raíz).
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Dentro de la red de Docker, PostgreSQL se resuelve por el nombre del servicio (db),
      # nunca por localhost ni por IP fija.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fashionstore}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-fashionstore}
    volumes:
      # Imágenes subidas por el Administrador (CU08/CU09, ver app/core/image_storage.py).
      # Sin este volumen, reconstruir la imagen del backend borra los archivos aunque
      # PostgreSQL siga teniendo la referencia -- las URLs quedarían apuntando a nada.
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend/web
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashionstore}
      POSTGRES_USER: ${POSTGRES_USER:-fashionstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fashionstore} -d ${POSTGRES_DB:-fashionstore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
