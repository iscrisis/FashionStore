@if (open()) {
  <div class="drawer-overlay" (click)="close.emit()">
    <aside class="drawer" (click)="$event.stopPropagation()">
      <header class="drawer__header">
        <h2>{{ readonly() ? 'Detalle de usuario' : isEditMode ? 'Editar usuario' : 'Nuevo usuario' }}</h2>
        <button type="button" class="icon-btn" (click)="close.emit()" aria-label="Cerrar">
          <app-icon name="close" style="width: 16px; height: 16px" />
        </button>
      </header>

      <form [formGroup]="form" (ngSubmit)="submit()" class="drawer__form">
        <label class="field" [class.has-error]="form.controls.nombre.invalid && form.controls.nombre.touched">
          <span class="field__label">Nombre *</span>
          <input type="text" formControlName="nombre" placeholder="Ej. Juan Pérez" />
          @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
            <span class="field__error">El nombre es obligatorio.</span>
          }
        </label>

        <label class="field" [class.has-error]="form.controls.correo.invalid && form.controls.correo.touched">
          <span class="field__label">Correo electrónico *</span>
          <input type="email" formControlName="correo" placeholder="juan@fashionstore.com" />
          @if (form.controls.correo.hasError('required') && form.controls.correo.touched) {
            <span class="field__error">El correo es obligatorio.</span>
          } @else if (form.controls.correo.hasError('email') && form.controls.correo.touched) {
            <span class="field__error">Ingresa un correo válido.</span>
          }
        </label>

        @if (!isEditMode) {
          <label class="field" [class.has-error]="form.controls.password.invalid && form.controls.password.touched">
            <span class="field__label">Contraseña inicial *</span>
            <input type="password" formControlName="password" placeholder="Mínimo 8 caracteres" />
            @if (form.controls.password.invalid && form.controls.password.touched) {
              <span class="field__error">La contraseña debe tener al menos 8 caracteres.</span>
            }
          </label>
        }

        <label class="field" [class.has-error]="form.controls.rol.invalid && form.controls.rol.touched">
          <span class="field__label">Rol *</span>
          <select formControlName="rol">
            <option value="" disabled>Selecciona un rol</option>
            @for (rol of roles(); track rol.valor) {
              <option [value]="rol.valor">{{ rol.etiqueta }}</option>
            }
          </select>
          @if (form.controls.rol.invalid && form.controls.rol.touched) {
            <span class="field__error">Selecciona un rol.</span>
          }
        </label>

        @if (mostrarSucursal) {
          <div class="field-row">
            <label
              class="field"
              [class.has-error]="form.controls.ciudad_id.invalid && form.controls.ciudad_id.touched"
            >
              <span class="field__label">Ciudad *</span>
              <select formControlName="ciudad_id">
                <option [value]="null" disabled>Selecciona una ciudad</option>
                @for (ciudad of ciudades(); track ciudad.id) {
                  <option [value]="ciudad.id">{{ ciudad.nombre }}</option>
                }
              </select>
              @if (form.controls.ciudad_id.invalid && form.controls.ciudad_id.touched) {
                <span class="field__error">Selecciona una ciudad.</span>
              }
            </label>

            <label
              class="field"
              [class.has-error]="form.controls.sucursal_id.invalid && form.controls.sucursal_id.touched"
            >
              <span class="field__label">Sucursal *</span>
              <select formControlName="sucursal_id">
                <option [value]="null" disabled>
                  {{ form.controls.ciudad_id.value ? 'Selecciona una sucursal' : 'Elige una ciudad primero' }}
                </option>
                @for (sucursal of sucursales(); track sucursal.id) {
                  <option [value]="sucursal.id">{{ sucursal.nombre }}</option>
                }
              </select>
              @if (form.controls.sucursal_id.invalid && form.controls.sucursal_id.touched) {
                <span class="field__error">Selecciona una sucursal.</span>
              }
            </label>
          </div>
        }

        @if (mostrarProveedor) {
          <label
            class="field"
            [class.has-error]="form.controls.proveedor_id.invalid && form.controls.proveedor_id.touched"
          >
            <span class="field__label">Proveedor *</span>
            <select formControlName="proveedor_id">
              <option [value]="null" disabled>Selecciona un proveedor</option>
              @for (proveedor of proveedores(); track proveedor.id) {
                <option [value]="proveedor.id">{{ proveedor.razon_social }}</option>
              }
            </select>
            @if (form.controls.proveedor_id.invalid && form.controls.proveedor_id.touched) {
              <span class="field__error">Selecciona el proveedor al que pertenece esta cuenta.</span>
            }
          </label>
        }

        <label class="field field--switch">
          <span class="field__label">Estado</span>
          <span class="switch">
            <input type="checkbox" formControlName="is_active" />
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span class="switch__text">{{ form.controls.is_active.value ? 'Activo' : 'Inactivo' }}</span>
          </span>
        </label>

        <footer class="drawer__footer">
          @if (readonly()) {
            <button type="button" class="btn btn--ghost" (click)="close.emit()">Cerrar</button>
          } @else {
            <button type="button" class="btn btn--ghost" (click)="close.emit()" [disabled]="submitting()">
              Cancelar
            </button>
            <button type="submit" class="btn btn--primary" [disabled]="submitting()">
              {{ submitting() ? 'Guardando…' : 'Guardar usuario' }}
            </button>
          }
        </footer>
      </form>
    </aside>
  </div>
}
