@if (open()) {
  <div class="drawer-overlay" (click)="close.emit()">
    <aside class="drawer" (click)="$event.stopPropagation()">
      <header class="drawer__header">
        <h2>{{ readonly() ? 'Detalle de sucursal' : isEditMode ? 'Editar sucursal' : 'Nueva sucursal' }}</h2>
        <button type="button" class="icon-btn" (click)="close.emit()" aria-label="Cerrar">
          <app-icon name="close" style="width: 16px; height: 16px" />
        </button>
      </header>

      <form [formGroup]="form" (ngSubmit)="submit()" class="drawer__form">
        <label class="field" [class.has-error]="form.controls.nombre.invalid && form.controls.nombre.touched">
          <span class="field__label">Nombre *</span>
          <input type="text" formControlName="nombre" placeholder="Ej. Sucursal Centro" />
          @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
            <span class="field__error">El nombre es obligatorio.</span>
          }
        </label>

        <label class="field" [class.has-error]="form.controls.ciudad_id.invalid && form.controls.ciudad_id.touched">
          <span class="field__label">Ciudad *</span>
          <select formControlName="ciudad_id">
            <option [value]="null" disabled>Selecciona una ciudad</option>
            @for (ciudad of ciudades(); track ciudad.id) {
              <option [value]="ciudad.id">{{ ciudad.nombre }}</option>
            }
          </select>
          @if (form.controls.ciudad_id.invalid && form.controls.ciudad_id.touched) {
            <span class="field__error">Selecciona una ciudad.</span>
          }
        </label>

        <label class="field" [class.has-error]="form.controls.direccion.invalid && form.controls.direccion.touched">
          <span class="field__label">Dirección *</span>
          <input type="text" formControlName="direccion" placeholder="Ej. Av. San Martín #123" />
          @if (form.controls.direccion.invalid && form.controls.direccion.touched) {
            <span class="field__error">La dirección debe tener al menos 5 caracteres.</span>
          }
        </label>

        <label class="field" [class.has-error]="form.controls.telefono.invalid && form.controls.telefono.touched">
          <span class="field__label">Teléfono *</span>
          <input type="text" formControlName="telefono" placeholder="Ej. 70012345" />
          @if (form.controls.telefono.invalid && form.controls.telefono.touched) {
            <span class="field__error">Ingresa un teléfono válido.</span>
          }
        </label>

        <label class="field field--switch">
          <span class="field__label">Estado</span>
          <span class="switch">
            <input type="checkbox" formControlName="is_active" />
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span class="switch__text">{{ form.controls.is_active.value ? 'Activa' : 'Inactiva' }}</span>
          </span>
        </label>

        <footer class="drawer__footer">
          @if (readonly()) {
            <button type="button" class="btn btn--ghost" (click)="close.emit()">Cerrar</button>
          } @else {
            <button type="button" class="btn btn--ghost" (click)="close.emit()" [disabled]="submitting()">
              Cancelar
            </button>
            <button type="submit" class="btn btn--primary" [disabled]="submitting()">
              {{ submitting() ? 'Guardando…' : 'Guardar sucursal' }}
            </button>
          }
        </footer>
      </form>
    </aside>
  </div>
}
