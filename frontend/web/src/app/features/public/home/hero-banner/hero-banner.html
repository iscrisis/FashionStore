<div class="hero">
  <div class="hero__text">
    <h1>NUEVA COLECCIÓN</h1>
    @if (coleccionDestacada(); as coleccion) {
      <a
        routerLink="/catalogo"
        [queryParams]="{ coleccion_id: coleccion.id }"
        class="hero__cta"
      >Explorar colección</a>
    }
  </div>

  @if (coleccionDestacada()?.imagen_destacada_url; as imagenUrl) {
    <img [src]="resolveMediaUrl(imagenUrl)" alt="" class="hero__image" />
  }
</div>
