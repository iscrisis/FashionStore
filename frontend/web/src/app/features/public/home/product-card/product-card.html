<a [routerLink]="['/producto', product().id]" class="card">
  <div class="card__image">
    @if (product().imagen_principal_url && !imageError()) {
      <img
        [src]="resolveMediaUrl(product().imagen_principal_url)"
        [alt]="product().nombre"
        (error)="imageError.set(true)"
      />
    } @else {
      <div class="card__placeholder">
        <app-icon name="products" style="width: 26px; height: 26px" />
      </div>
    }
    <button
      type="button"
      class="card__favorite"
      [class.is-active]="isFavorite()"
      (click)="toggleFavorite($event)"
      aria-label="Guardar en favoritos"
    >
      <app-icon name="heart" style="width: 15px; height: 15px" />
    </button>
  </div>
  <div class="card__info">
    <span class="card__name">{{ product().nombre }}</span>
    <span class="card__price">Bs {{ product().precio_venta.toFixed(2) }}</span>
  </div>
</a>
