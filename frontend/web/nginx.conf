server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular Router usa rutas "path" (sin #), así que cualquier ruta desconocida
    # por Nginx debe resolver a index.html para que el Router la maneje en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La app llama a rutas relativas "/api/v1/..." (ver environment.ts).
    # Nginx las reenvía al backend dentro de la red de Docker por nombre de servicio,
    # evitando así configurar CORS entre el frontend y la API.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
